[versions]
kotlin = "2.4.21"
compose-plugin = "1.12.2"
compose-material3 = "1.9.0"
# Ultima versione pubblicata: la libreria non riceve più aggiornamenti (vedi note di Compose 1.8).
compose-material-icons = "1.7.3"
coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
sqlite = "3.54.1.0"
vosk = "0.3.45"
mp3spi = "1.9.5.4"
jump3r = "1.0.6"
jna = "5.19.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
vosk = { module = "com.alphacephei:vosk", version.ref = "vosk" }
mp3spi = { module = "com.googlecode.soundlibs:mp3spi", version.ref = "mp3spi" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
jump3r = { module = "io.github.raphimc:jump3r", version.ref = "jump3r" }

compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
